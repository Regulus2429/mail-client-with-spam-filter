{% extends 'base.html' %}{% block content %}<section><h1>写邮件</h1><form method="post" enctype="multipart/form-data"><input type="hidden" name="csrf" value="{{ session.csrf }}"><label>收件人<input name="to" required value="{{ request.form.get('to', '') }}" placeholder="bob@example.test"><small>多个账号用逗号、分号或空格分隔。</small></label><label>主题<input name="subject" required value="{{ request.form.get('subject', '') }}"></label><label>正文<textarea name="body" rows="10" required>{{ request.form.get('body', '') }}</textarea></label><label>附件（可多选）<input type="file" name="attachments" multiple><small>整个表单最多 20 MiB；附件编码后邮件大小还受服务器限制。</small></label><button>发送邮件</button></form></section>{% endblock %}
